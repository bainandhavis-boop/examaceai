<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamAce AI — Code Graph Visualizer</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-2: #059669;
      --shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #eff6ff 0%, #ecfdf5 100%);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: auto 1fr;
      height: 100vh;
      gap: 0;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.875rem 1.25rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      z-index: 10;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.875rem;
    }

    .panel h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.625rem;
    }

    input[type="search"],
    select {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.875rem;
      background: white;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .stat {
      background: white;
      border-radius: 8px;
      padding: 0.625rem;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat strong {
      display: block;
      font-size: 1.25rem;
      color: var(--accent);
    }

    .stat span {
      font-size: 0.7rem;
      color: var(--muted);
    }

    .legend-item,
    .filter-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      margin-bottom: 0.35rem;
      cursor: pointer;
      user-select: none;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .edge-swatch {
      width: 20px;
      height: 3px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .detail-empty {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .detail-card h3 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
      word-break: break-word;
    }

    .detail-card dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.25rem 0.75rem;
      font-size: 0.8rem;
    }

    .detail-card dt {
      color: var(--muted);
      font-weight: 500;
    }

    .detail-card dd {
      word-break: break-word;
    }

    .detail-card .tag {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 0.7rem;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      margin-right: 0.25rem;
      margin-top: 0.25rem;
    }

    .graph-wrap {
      position: relative;
      min-height: 0;
    }

    #graph {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #ffffff 0%, #f1f5f9 100%);
    }

    .toolbar {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      z-index: 5;
    }

    button {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }

    button:hover {
      background: #f8fafc;
      box-shadow: var(--shadow);
    }

    button.primary {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: white;
      border: none;
    }

    #status {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      color: var(--muted);
      z-index: 5;
      backdrop-filter: blur(6px);
    }

    #load-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(248, 250, 252, 0.85);
      z-index: 20;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
      .sidebar { max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>ExamAce AI Code Graph</h1>
        <p>Interactive dependency map from graphify-out/graph.json</p>
      </div>
      <div class="header-actions">
        <label>
          <input type="file" id="file-input" accept=".json" class="hidden" />
          <button type="button" id="load-file-btn">Load graph.json</button>
        </label>
      </div>
    </header>

    <aside class="sidebar">
      <div class="panel">
        <h2>Search</h2>
        <input type="search" id="search" placeholder="Filter by label or file…" />
      </div>

      <div class="panel">
        <h2>Stats</h2>
        <div class="stats">
          <div class="stat"><strong id="stat-nodes">—</strong><span>Nodes</span></div>
          <div class="stat"><strong id="stat-edges">—</strong><span>Edges</span></div>
          <div class="stat"><strong id="stat-visible">—</strong><span>Visible</span></div>
          <div class="stat"><strong id="stat-communities">—</strong><span>Communities</span></div>
        </div>
      </div>

      <div class="panel">
        <h2>Edge types</h2>
        <div id="edge-filters"></div>
      </div>

      <div class="panel">
        <h2>Selected node</h2>
        <div id="node-detail" class="detail-empty">
          Click a node to inspect its file, location, and connections.
        </div>
      </div>
    </aside>

    <main class="graph-wrap">
      <div id="load-overlay">Loading graph.json…</div>
      <div id="graph"></div>
      <div class="toolbar">
        <button type="button" id="fit-btn" class="primary">Fit view</button>
        <button type="button" id="stabilize-btn">Stabilize</button>
        <button type="button" id="physics-btn">Toggle physics</button>
        <button type="button" id="labels-btn">Toggle labels</button>
      </div>
      <div id="status">Ready</div>
    </main>
  </div>

  <script>
    const COMMUNITY_COLORS = [
      "#2563eb", "#059669", "#7c3aed", "#ea580c", "#db2777",
      "#0891b2", "#4f46e5", "#16a34a", "#ca8a04", "#dc2626",
      "#0d9488", "#9333ea", "#c026d3", "#0284c7", "#65a30d",
      "#e11d48", "#0369a1", "#15803d", "#a16207", "#be123c",
    ];

    const EDGE_COLORS = {
      calls: "#2563eb",
      imports: "#64748b",
      imports_from: "#475569",
      re_exports: "#7c3aed",
      extends: "#059669",
      contains: "#94a3b8",
      dynamic_import: "#ea580c",
    };

    let rawGraph = null;
    let network = null;
    let physicsEnabled = true;
    let labelsEnabled = false;
    let activeRelations = new Set();
    let visNodes = null;
    let visEdges = null;

    const els = {
      overlay: document.getElementById("load-overlay"),
      graph: document.getElementById("graph"),
      search: document.getElementById("search"),
      nodeDetail: document.getElementById("node-detail"),
      edgeFilters: document.getElementById("edge-filters"),
      status: document.getElementById("status"),
      statNodes: document.getElementById("stat-nodes"),
      statEdges: document.getElementById("stat-edges"),
      statVisible: document.getElementById("stat-visible"),
      statCommunities: document.getElementById("stat-communities"),
      fileInput: document.getElementById("file-input"),
      loadFileBtn: document.getElementById("load-file-btn"),
      fitBtn: document.getElementById("fit-btn"),
      stabilizeBtn: document.getElementById("stabilize-btn"),
      physicsBtn: document.getElementById("physics-btn"),
      labelsBtn: document.getElementById("labels-btn"),
    };

    function setStatus(text) {
      els.status.textContent = text;
    }

    function communityColor(community) {
      return COMMUNITY_COLORS[Number(community) % COMMUNITY_COLORS.length];
    }

    function nodeShape(node) {
      if (node.file_type === "concept") return "diamond";
      if (node._callable) return "dot";
      return "box";
    }

    function nodeSize(node, degree) {
      if (node.file_type === "concept") return 14;
      if (node._callable && node._callable_class) return 10 + Math.min(degree, 8);
      return 8 + Math.min(degree, 6);
    }

    function buildVisData(graph, relationFilter, searchTerm) {
      const links = graph.links || graph.edges || [];
      const degrees = new Map();

      for (const link of links) {
        degrees.set(link.source, (degrees.get(link.source) || 0) + 1);
        degrees.set(link.target, (degrees.get(link.target) || 0) + 1);
      }

      const search = searchTerm.trim().toLowerCase();
      const nodeById = new Map(graph.nodes.map((n) => [n.id, n]));

      const visibleNodeIds = new Set();
      if (!search) {
        graph.nodes.forEach((n) => visibleNodeIds.add(n.id));
      } else {
        graph.nodes.forEach((n) => {
          const hay = `${n.label} ${n.source_file || ""} ${n.norm_label || ""}`.toLowerCase();
          if (hay.includes(search)) visibleNodeIds.add(n.id);
        });
        links.forEach((l) => {
          if (visibleNodeIds.has(l.source)) visibleNodeIds.add(l.target);
          if (visibleNodeIds.has(l.target)) visibleNodeIds.add(l.source);
        });
      }

      const nodes = graph.nodes
        .filter((n) => visibleNodeIds.has(n.id))
        .map((n) => ({
          id: n.id,
          label: labelsEnabled ? n.label : undefined,
          title: buildTooltip(n, degrees.get(n.id) || 0),
          color: {
            background: communityColor(n.community),
            border: "#ffffff",
            highlight: { background: communityColor(n.community), border: "#0f172a" },
            hover: { background: communityColor(n.community), border: "#0f172a" },
          },
          font: { color: "#0f172a", size: 12, face: "Inter, sans-serif" },
          shape: nodeShape(n),
          size: nodeSize(n, degrees.get(n.id) || 0),
          borderWidth: 2,
          shadow: true,
          _raw: n,
        }));

      const edges = links
        .filter(
          (l) =>
            relationFilter.has(l.relation) &&
            visibleNodeIds.has(l.source) &&
            visibleNodeIds.has(l.target)
        )
        .map((l, i) => ({
          id: `${l.source}-${l.target}-${l.relation}-${i}`,
          from: l.source,
          to: l.target,
          label: labelsEnabled ? l.relation : undefined,
          title: `${l.relation}${l.source_file ? `\n${l.source_file}:${l.source_location || ""}` : ""}`,
          color: { color: EDGE_COLORS[l.relation] || "#cbd5e1", highlight: "#0f172a", hover: "#334155" },
          arrows: l.relation === "calls" || l.relation === "imports_from" ? "to" : undefined,
          width: Math.max(1, Math.min(4, (l.weight || 1) * 1.5)),
          smooth: { type: "dynamic" },
          _raw: l,
        }));

      return { nodes, edges, visibleCount: visibleNodeIds.size };
    }

    function buildTooltip(node, degree) {
      return [
        node.label,
        node.source_file ? `File: ${node.source_file}` : null,
        node.source_location ? `Location: ${node.source_location}` : null,
        `Community: ${node.community}`,
        `Connections: ${degree}`,
        node.file_type ? `Type: ${node.file_type}` : null,
      ]
        .filter(Boolean)
        .join("\n");
    }

    function renderNodeDetail(nodeId) {
      const node = rawGraph.nodes.find((n) => n.id === nodeId);
      if (!node) {
        els.nodeDetail.className = "detail-empty";
        els.nodeDetail.textContent = "Click a node to inspect its file, location, and connections.";
        return;
      }

      const links = (rawGraph.links || rawGraph.edges || []).filter(
        (l) => l.source === nodeId || l.target === nodeId
      );

      const tags = [];
      if (node.file_type) tags.push(node.file_type);
      if (node._callable) tags.push(node._callable_class ? "callable class" : "callable");
      if (node._origin) tags.push(node._origin);

      els.nodeDetail.className = "detail-card";
      els.nodeDetail.innerHTML = `
        <h3>${escapeHtml(node.label)}</h3>
        <div>${tags.map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>
        <dl style="margin-top:0.75rem">
          <dt>ID</dt><dd>${escapeHtml(node.id)}</dd>
          ${node.source_file ? `<dt>File</dt><dd>${escapeHtml(node.source_file)}</dd>` : ""}
          ${node.source_location ? `<dt>Location</dt><dd>${escapeHtml(node.source_location)}</dd>` : ""}
          <dt>Community</dt><dd>${escapeHtml(String(node.community))}</dd>
          <dt>Connections</dt><dd>${links.length}</dd>
        </dl>
      `;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderEdgeFilters(relations) {
      els.edgeFilters.innerHTML = "";
      relations.forEach((relation) => {
        const id = `rel-${relation}`;
        const item = document.createElement("label");
        item.className = "filter-item";
        item.innerHTML = `
          <input type="checkbox" id="${id}" data-relation="${relation}" checked />
          <span class="edge-swatch" style="background:${EDGE_COLORS[relation] || "#cbd5e1"}"></span>
          <span>${relation}</span>
        `;
        item.querySelector("input").addEventListener("change", refreshGraph);
        els.edgeFilters.appendChild(item);
      });
    }

    function getActiveRelations() {
      const checked = [...els.edgeFilters.querySelectorAll("input[type=checkbox]:checked")];
      return new Set(checked.map((el) => el.dataset.relation));
    }

    function initNetwork() {
      const relations = [...new Set((rawGraph.links || rawGraph.edges || []).map((l) => l.relation))].sort();
      activeRelations = new Set(relations);
      renderEdgeFilters(relations);

      const communities = new Set(rawGraph.nodes.map((n) => n.community));
      els.statNodes.textContent = rawGraph.nodes.length;
      els.statEdges.textContent = (rawGraph.links || rawGraph.edges || []).length;
      els.statCommunities.textContent = communities.size;

      const { nodes, edges, visibleCount } = buildVisData(rawGraph, activeRelations, "");
      els.statVisible.textContent = visibleCount;

      visNodes = new vis.DataSet(nodes);
      visEdges = new vis.DataSet(edges);

      const options = {
        autoResize: true,
        interaction: {
          hover: true,
          tooltipDelay: 120,
          multiselect: false,
          navigationButtons: false,
          keyboard: { enabled: true },
        },
        physics: {
          enabled: physicsEnabled,
          stabilization: { iterations: 180, fit: true },
          barnesHut: {
            gravitationalConstant: -4200,
            centralGravity: 0.25,
            springLength: 130,
            springConstant: 0.04,
            damping: 0.35,
          },
        },
        nodes: {
          chosen: true,
        },
        edges: {
          chosen: true,
          font: { size: 10, align: "middle", color: "#64748b" },
        },
        layout: {
          improvedLayout: true,
        },
      };

      if (network) network.destroy();
      network = new vis.Network(els.graph, { nodes: visNodes, edges: visEdges }, options);

      network.on("click", (params) => {
        if (params.nodes.length) {
          renderNodeDetail(params.nodes[0]);
          setStatus(`Selected: ${params.nodes[0]}`);
        }
      });

      network.on("stabilizationIterationsDone", () => {
        setStatus(`Graph stabilized · ${visNodes.length} nodes · ${visEdges.length} edges`);
      });

      network.on("dragStart", () => setStatus("Dragging node…"));
      network.on("dragEnd", () => setStatus("Node moved"));
    }

    function refreshGraph() {
      if (!rawGraph || !network) return;
      const relations = getActiveRelations();
      const { nodes, edges, visibleCount } = buildVisData(
        rawGraph,
        relations,
        els.search.value
      );
      els.statVisible.textContent = visibleCount;
      visNodes.clear();
      visEdges.clear();
      visNodes.add(nodes);
      visEdges.add(edges);
      setStatus(`Showing ${nodes.length} nodes · ${edges.length} edges`);
    }

    function loadGraph(data) {
      rawGraph = data;
      els.overlay.classList.add("hidden");
      initNetwork();
    }

    async function fetchGraph() {
      try {
        const res = await fetch("./graph.json");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        loadGraph(await res.json());
      } catch (err) {
        els.overlay.innerHTML = `
          <div style="text-align:center;max-width:420px;padding:1rem">
            <p style="margin-bottom:0.75rem">Could not load <code>graph.json</code> automatically.</p>
            <p style="font-size:0.85rem;color:#64748b;margin-bottom:1rem">
              Open via a local server (e.g. <code>npx serve graphify-out</code>) or use the button below.
            </p>
            <button type="button" class="primary" onclick="document.getElementById('file-input').click()">
              Choose graph.json
            </button>
          </div>`;
        console.error(err);
      }
    }

    els.search.addEventListener("input", refreshGraph);

    els.fitBtn.addEventListener("click", () => network?.fit({ animation: true }));
    els.stabilizeBtn.addEventListener("click", () => network?.stabilize());
    els.physicsBtn.addEventListener("click", () => {
      physicsEnabled = !physicsEnabled;
      network?.setOptions({ physics: { enabled: physicsEnabled } });
      setStatus(physicsEnabled ? "Physics enabled" : "Physics disabled");
    });
    els.labelsBtn.addEventListener("click", () => {
      labelsEnabled = !labelsEnabled;
      refreshGraph();
      setStatus(labelsEnabled ? "Labels shown" : "Labels hidden");
    });

    els.loadFileBtn.addEventListener("click", () => els.fileInput.click());
    els.fileInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          loadGraph(JSON.parse(reader.result));
        } catch (err) {
          alert("Invalid JSON file.");
          console.error(err);
        }
      };
      reader.readAsText(file);
    });

    fetchGraph();
  </script>
</body>
</html>
